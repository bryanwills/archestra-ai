[package]
name = "baton-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "ADT-based information-flow label engine for agent trajectories (prototype)"

[dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
enumset = { version = "1", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
serde_json = "1"
proptest = "1"

[lints]
workspace = true
